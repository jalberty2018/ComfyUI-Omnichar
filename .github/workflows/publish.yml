# Publishes packages/omnichar-sdk with Trusted Publishing. No API token is stored anywhere.
name: Publish omnichar-sdk

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: Which index to publish to
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions: {}

env:
  # The package is a subdirectory, so every step runs from here rather than the repo root.
  PACKAGE_DIR: packages/omnichar-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'

      - name: Install
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          uv venv
          uv pip install -e '.[dev]'
          # Proves the extras landed in ./.venv. Without this a missing Pillow surfaces later as
          # nine unresolved PIL imports from pyright, which names the wrong cause.
          .venv/bin/python -c "import PIL, pytest, pyright; print('PIL', PIL.__version__)"

      # The ComfyUI tests are skipped: they need torch, and the pack is not what ships here.
      - name: Test
        working-directory: ${{ env.PACKAGE_DIR }}
        run: .venv/bin/python -m pytest ../../tests -q --ignore=../../tests/test_comfy_nodes.py

      # pyright reads venvPath/venv from pyproject.toml, so it resolves ./.venv rather than
      # whichever interpreter it would otherwise discover.
      - name: Lint and typecheck
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          .venv/bin/ruff check src
          .venv/bin/python -m pyright

      - name: Build
        working-directory: ${{ env.PACKAGE_DIR }}
        run: uv build

      - name: Check metadata
        working-directory: ${{ env.PACKAGE_DIR }}
        run: uvx --from twine twine check dist/*

      # A tag that disagrees with pyproject publishes the wrong version, or is rejected as a
      # duplicate after the release already exists. Cheaper to catch here.
      - name: Tag matches the built version
        if: github.event_name == 'release'
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.tar.gz | sed -E 's/.*-([0-9][^-]*)\.tar\.gz/\1/')
          echo "tag=$tag built=$built"
          [ "$tag" = "$built" ] || { echo "::error::tag $tag does not match version $built"; exit 1; }

      - uses: actions/upload-artifact@v5
        with:
          name: dist
          path: ${{ env.PACKAGE_DIR }}/dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: github.event_name == 'release' || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
