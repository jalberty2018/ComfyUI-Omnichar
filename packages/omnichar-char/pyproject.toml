[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "omnichar-char"
version = "0.0.1"
description = "Read Omnichar Studio .char character files: references, description, prompt and LoRA."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Aesthisia Datacenters Private Limited" }]
keywords = ["omnichar", "char", "character", "lora", "comfyui", "diffusion"]
# Deliberately empty. The whole point of this package is that it drops into a host's environment
# without competing with whatever that host has pinned.
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Graphics",
]

[project.optional-dependencies]
images = ["Pillow>=10.0"]
dev = ["pytest>=8.0", "ruff>=0.6", "Pillow>=10.0"]

[project.urls]
Repository = "https://github.com/omnichar/omnichar-char"
Homepage = "https://omnichar.org"

[project.scripts]
omnichar-char = "omnichar_char.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/omnichar_char"]

[tool.pyright]
include = ["src"]
# Standard, not strict. A manifest is JSON, so every field is dict[str, Any] and strict reports it
# as partially unknown; the alternative is a TypedDict per field, which would make the reader
# refuse a valid manifest carrying a key it does not model. Pillow also ships no stubs pyright
# accepts, and it is an optional extra. Strict was run once and every real finding it produced is
# fixed; what remained was those two categories alone.
typeCheckingMode = "standard"
pythonVersion = "3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
